# Config for the end-to-end suite, which lives at the repo root because it
# spans both projects: test/backend drives the API, test/frontend drives a real
# browser. The backend's own unit tests configure from backend/pyproject.toml.
[pytest]
testpaths = test/architecture test/pipeline test/backend test/journey
python_files = test_*.py
addopts = -ra --strict-markers --tb=short
markers =
    e2e: requires the full stack (Postgres, Elasticsearch, backend on :8000)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
